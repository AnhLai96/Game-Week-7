<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELA 2 | My True Story Reading Detective</title><style>
:root{--wine:#7b1f35;--pink:#fbf4f3;--gold:#c7a56a}*{box-sizing:border-box}body{margin:0;background:#f4eee8;color:#3f3235;font:18px/1.5 'Trebuchet MS',Arial,sans-serif}.wrap{max-width:790px;margin:24px auto;padding:20px;background:#fffdf9;border:3px solid var(--wine);border-radius:20px}h1,h2{color:var(--wine)}h1{text-align:center;font:700 35px Georgia,serif;margin:6px 0}header{text-align:center}.subtitle{color:#8b6670}main{background:var(--pink);padding:24px;border-radius:15px;margin:20px 0}.options{display:grid;gap:12px}.option{background:white;border:2px solid #e3c9cf;border-radius:13px;padding:14px;text-align:left;cursor:pointer;font:inherit}.option:hover:not(:disabled),.option:focus-visible{border-color:var(--wine);outline:2px solid var(--gold)}.option:disabled{cursor:default}.correct{background:#dff4e4!important;border-color:#218451!important}.wrong{background:#ffe5e5!important;border-color:#b33b3b!important}.bar{height:14px;background:#eadfe1;border-radius:30px;overflow:hidden}.fill{height:100%;background:var(--wine);width:0;transition:width .3s}button.action{border:0;background:var(--wine);color:white;border-radius:12px;padding:12px 19px;font:700 17px Arial;cursor:pointer;margin:6px 8px 0 0}button.action:disabled{opacity:.4;cursor:default}.feedback{min-height:55px;font-weight:700;margin-top:16px}#done{text-align:center}.pill{background:#fff8dd;padding:12px;border-radius:10px;margin-top:12px}.hidden{display:none}#score{font-weight:bold;color:var(--wine)}@media(max-width:520px){.wrap{margin:5px;padding:12px}main{padding:14px}h1{font-size:27px}}</style></head><body><div class="wrap"><header><div style="font-size:43px">📖 🕵️ ⭐</div><h1>My True Story Detective</h1><p class="subtitle">ELA Grade 2 • Lesson 1 • Nonfiction Narratives</p><div class="pill">Read the question. Choose one answer. Earn stars! ⭐</div></header><p><span id="progress">Question 1 of 15</span> <span style="float:right" id="score">⭐ 0</span></p><div class="bar"><div class="fill" id="fill"></div></div><main id="game"><h2 id="question"></h2><button class="action" onclick="speak()">🔊 Read aloud</button><div class="options" id="options" style="margin-top:16px"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="action" onclick="advance()" disabled>Next question →</button></main><main id="done" class="hidden"><h2>🎉 Great work, Reading Detective!</h2><p id="final"></p><button class="action" onclick="restart()">🔁 Play again</button></main><p style="text-align:center;font-size:14px">Read • Think • Find details • Plan your true story</p></div><script>
const questions=[{"q": "Which sentence could describe a real experience?", "options": ["I rode a bike at the park.", "My shoes flew to the sun.", "A dragon cooked my lunch.", "My pencil began to sing."], "answer": 0, "explain": "A bike ride at the park could really happen."}, {"q": "What is a nonfiction narrative?", "options": ["A list of made-up spells", "A story about something real", "A book of only animal facts", "A set of cooking steps"], "answer": 1, "explain": "A nonfiction narrative tells a story about real events."}, {"q": "Which word tells how someone feels?", "options": ["excited", "playground", "Saturday", "bicycle"], "answer": 0, "explain": "Excited is a feeling."}, {"q": "Which sentence is a story event?", "options": ["I felt proud.", "I was nervous.", "I rode my bike.", "I felt happy."], "answer": 2, "explain": "Riding a bike is something that happens."}, {"q": "Which word helps show the first event?", "options": ["Finally", "Because", "First", "Afterward"], "answer": 2, "explain": "First introduces the opening event."}, {"q": "What belongs in the beginning of a true story?", "options": ["How the story starts", "Only the last feeling", "The final event", "A list of made-up characters"], "answer": 0, "explain": "The beginning tells how the real experience starts."}, {"q": "Which sentence best shows an ending?", "options": ["Next, I opened my bag.", "First, we arrived.", "Then, I ate lunch.", "Finally, we went home."], "answer": 3, "explain": "Finally, we went home is a closing event."}, {"q": "What should a story planner help you remember?", "options": ["Only the title", "Who, where, events and feelings", "Only difficult spellings", "Only the last sentence"], "answer": 1, "explain": "A planner gathers people, place, events and feelings."}, {"q": "Which pair includes an event and a feeling?", "options": ["park / Saturday", "I won a race / proud", "blue / tall", "quickly / softly"], "answer": 1, "explain": "Winning is an event; proud is a feeling."}, {"q": "Which order makes sense for a trip?", "options": ["Go home → arrive → pack", "Arrive → pack → leave", "Pack → travel → arrive", "Play → wake up → pack"], "answer": 2, "explain": "You pack, travel and then arrive."}, {"q": "Which sentence tells a feeling?", "options": ["I felt nervous.", "We visited the park.", "Dad carried the bag.", "I opened the door."], "answer": 0, "explain": "Nervous is a feeling."}, {"q": "Which question helps plan a story setting?", "options": ["Where did it happen?", "How many commas are there?", "What colour is the title?", "How long is the pencil?"], "answer": 0, "explain": "The setting tells where an event happened."}, {"q": "Which is a good story title?", "options": ["My Trip to the Zoo", "First Next Finally", "The Last Sentence", "A Full Stop"], "answer": 0, "explain": "A title tells the reader what the true story is about."}, {"q": "What should you do after planning?", "options": ["Write a first draft", "Throw away your ideas", "Change the story to fantasy", "Skip all the events"], "answer": 0, "explain": "After planning, writers begin a draft."}, {"q": "Which sentence shows an event followed by a feeling?", "options": ["I saw my friend and felt happy.", "I was happy and excited.", "My friend was tall and kind.", "The park was big and green."], "answer": 0, "explain": "Seeing a friend is an event; happy is a feeling."}];let index=0,stars=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;const q=questions[index];$('progress').textContent=`Question ${index+1} of ${questions.length}`;$('score').textContent=`⭐ ${stars}`;$('fill').style.width=`${index/questions.length*100}%`;$('question').textContent=q.q;$('feedback').textContent='';$('next').disabled=true;$('next').textContent=index===questions.length-1?'See my score →':'Next question →';$('options').replaceChildren();q.options.forEach((o,j)=>{let b=document.createElement('button');b.className='option';b.textContent=`${'ABCD'[j]}. ${o}`;b.onclick=()=>select(j);$('options').appendChild(b)})}function select(j){if(answered)return;answered=true;const q=questions[index];if(j===q.answer)stars++;[...$('options').children].forEach((b,k)=>{b.disabled=true;if(k===q.answer)b.classList.add('correct');else if(k===j)b.classList.add('wrong')});$('feedback').textContent=(j===q.answer?'🌟 Well done! ':'💡 Keep learning! ')+q.explain;$('score').textContent=`⭐ ${stars}`;$('next').disabled=false}function advance(){if(index<questions.length-1){index++;render()}else{$('game').classList.add('hidden');$('done').classList.remove('hidden');$('fill').style.width='100%';$('progress').textContent='Finished!';$('final').textContent=`You earned ${stars} out of ${questions.length} stars!`}}function restart(){index=0;stars=0;$('done').classList.add('hidden');$('game').classList.remove('hidden');render()}function speak(){if(!('speechSynthesis'in window)){alert('Read-aloud is not available in this browser.');return}speechSynthesis.cancel();let q=questions[index];let u=new SpeechSynthesisUtterance(q.q+'. '+q.options.map((x,i)=>'Option '+('ABCD'[i])+': '+x).join('. '));u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}render();</script></body></html>
